name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm check

      - name: Build locally
        env:
          APP_ENV: local
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_DATA_MODE: fixture
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: pnpm build
